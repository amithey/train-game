<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Train Runner - Realistic Edition</title>
    <style>
        body {
            margin: 0;
            background: #121212;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ecf0f1;
            overflow: hidden;
            touch-action: none;
        }
        h1 {
            margin-top: 20px;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            font-weight: 800;
            letter-spacing: 2px;
            color: #f39c12;
        }
        .instructions {
            margin: 0 0 15px 0;
            font-size: 0.9em;
            color: #95a5a6;
        }
        canvas {
            background: #111;
            border: 4px solid #2c3e50;
            border-radius: 8px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
            max-width: 100vw;
            max-height: 80vh;
        }
        .stats {
            display: flex;
            justify-content: space-between;
            width: 400px;
            margin-top: 10px;
            font-weight: bold;
            font-size: 1.1em;
            color: #f1c40f;
        }
    </style>
</head>
<body>
    <h1>TRAIN RUNNER</h1>
    <p class="instructions">Arrows to Move/Jump | R to Restart</p>
    <canvas id="gameCanvas" width="400" height="600"></canvas>
    <div class="stats">
        <span id="scoreVal">Score: 0</span>
        <span id="highScoreVal">High Score: 0</span>
    </div>

    <script>
        (function() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const scoreEl = document.getElementById('scoreVal');
            const highScoreEl = document.getElementById('highScoreVal');

            const width = canvas.width;
            const height = canvas.height;
            const trackWidth = 320;
            const trackStartX = (width - trackWidth) / 2;
            const laneCount = 3;
            const laneWidth = trackWidth / laneCount;

            function getLaneCenter(lane) {
                return trackStartX + lane * laneWidth + laneWidth / 2;
            }

            // Texture generator
            function createTexture(w, h, baseColor, noiseColor1, noiseColor2, density) {
                const c = document.createElement('canvas');
                c.width = w; c.height = h;
                const cx = c.getContext('2d');
                cx.fillStyle = baseColor;
                cx.fillRect(0, 0, w, h);
                for(let i=0; i<w*h*density; i++) {
                    cx.fillStyle = Math.random() > 0.5 ? noiseColor1 : noiseColor2;
                    cx.fillRect(Math.random()*w, Math.random()*h, 2, 2);
                }
                return c;
            }

            const gravelTex = createTexture(width, height, '#3a3a3a', '#2a2a2a', '#4a4a4a', 0.15);
            const grassTex = createTexture(width, height, '#1e3d23', '#274e2d', '#18331c', 0.2);

            // Game State
            let gameState = 'START';
            let score = 0;
            let highScore = localStorage.getItem('trainRunnerHighScore') || 0;
            let speed = 6;
            let trackOffset = 0;
            let frameCount = 0;

            const player = {
                lane: 1,
                visualX: getLaneCenter(1),
                y: 0,
                vy: 0,
                width: laneWidth * 0.65,
                height: 70,
                targetX: getLaneCenter(1)
            };
            const gravity = 0.6;
            const jumpForce = -12;

            let obstacles = [];
            let coins = [];
            let scenery = [];
            let particles = [];
            let spawnTimer = 0;
            let spawnInterval = 90;

            function updateHighScore() {
                highScoreEl.innerText = 'High Score: ' + Math.floor(highScore / 10);
            }
            updateHighScore();

            function spawnObstacle() {
                const lane = Math.floor(Math.random() * laneCount);
                const type = Math.random() < 0.6 ? 'train' : 'barrier';
                const obsHeight = type === 'train' ? 140 : 40;
                obstacles.push({
                    lane,
                    y: -obsHeight - 50, // spawn further up to avoid pop-in
                    width: laneWidth * 0.75,
                    height: obsHeight,
                    type,
                    colorId: Math.floor(Math.random() * 3) // For different train colors
                });
            }

            function spawnCoin() {
                if (Math.random() > 0.4) return;
                const lane = Math.floor(Math.random() * laneCount);
                const collision = obstacles.some(o => o.lane === lane && o.y < 150);
                if (!collision) {
                    coins.push({ lane, y: -60, radius: 12 });
                }
            }

            function spawnScenery() {
                if (Math.random() < 0.2) {
                    scenery.push({
                        side: Math.random() > 0.5 ? 0 : 1,
                        y: -100,
                        size: 25 + Math.random() * 25
                    });
                }
            }

            function resetGame() {
                player.lane = 1;
                player.visualX = getLaneCenter(player.lane);
                player.targetX = player.visualX;
                player.y = 0;
                player.vy = 0;
                obstacles = [];
                coins = [];
                scenery = [];
                particles = [];
                score = 0;
                speed = 6;
                spawnTimer = 0;
                spawnInterval = 90;
                frameCount = 0;
                gameState = 'PLAYING';
            }

            function update() {
                if (gameState !== 'PLAYING') return;

                frameCount++;
                trackOffset = (trackOffset + speed) % 120; // larger modulo to accommodate wider ties spacing

                speed += 0.001;
                spawnTimer++;
                if (spawnTimer >= spawnInterval) {
                    spawnObstacle();
                    spawnCoin();
                    spawnTimer = 0;
                    if (spawnInterval > 40) spawnInterval -= 0.5;
                }
                spawnScenery();

                player.targetX = getLaneCenter(player.lane);
                player.visualX += (player.targetX - player.visualX) * 0.25;

                if (player.vy !== 0 || player.y < 0) {
                    player.vy += gravity;
                    player.y += player.vy;
                    if (player.y >= 0) {
                        player.y = 0;
                        player.vy = 0;
                        // Landing particles
                        for(let i=0; i<10; i++) {
                            particles.push({
                                x: player.visualX + (Math.random()-0.5)*player.width,
                                y: height - 20,
                                vx: (Math.random() - 0.5) * 4,
                                vy: (Math.random() - 0.5) * -4,
                                life: 1.0,
                                size: 3 + Math.random() * 4,
                                type: 'dust'
                            });
                        }
                    }
                }

                // Smoke from player train
                if (frameCount % 3 === 0) {
                    particles.push({
                        x: player.visualX,
                        y: height - player.height - 20 - player.y + 10,
                        vx: (Math.random() - 0.5) * 2,
                        vy: -speed - 1 - Math.random() * 2,
                        life: 1.0,
                        size: 8 + Math.random() * 6,
                        type: 'smoke'
                    });
                }

                obstacles.forEach(o => o.y += speed);
                obstacles = obstacles.filter(o => o.y < height + 200);

                coins.forEach(c => c.y += speed);
                coins = coins.filter(c => c.y < height + 50);

                scenery.forEach(s => s.y += speed * 1.2); // Parallax effect
                scenery = scenery.filter(s => s.y < height + 100);

                // Particles
                for (let i = particles.length - 1; i >= 0; i--) {
                    let p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy + speed; // move with world
                    p.life -= p.type === 'smoke' ? 0.015 : 0.03;
                    p.size += 0.2;
                    if (p.life <= 0) particles.splice(i, 1);
                }

                const playerBottom = height - 20 - player.y;
                const playerTop = playerBottom - player.height;
                const playerLeft = player.visualX - player.width / 2;
                const playerRight = player.visualX + player.width / 2;

                for (const o of obstacles) {
                    const oLeft = getLaneCenter(o.lane) - o.width / 2;
                    const oRight = getLaneCenter(o.lane) + o.width / 2;
                    const oTop = o.y;
                    const oBottom = o.y + o.height;

                    if (playerRight > oLeft + 5 && playerLeft < oRight - 5 &&
                        playerBottom > oTop + 5 && playerTop < oBottom - 5) { // +5 for slightly forgiving hitbox
                        const canJumpOver = o.type === 'barrier' && player.y > o.height;
                        if (!canJumpOver) {
                            gameState = 'GAMEOVER';
                            if (score > highScore) {
                                highScore = score;
                                localStorage.setItem('trainRunnerHighScore', highScore);
                                updateHighScore();
                            }
                        }
                    }
                }

                for (let i = coins.length - 1; i >= 0; i--) {
                    const c = coins[i];
                    const cX = getLaneCenter(c.lane);
                    const dist = Math.hypot(player.visualX - cX, (height - 40 - player.y) - c.y); // Adjust Y center
                    if (dist < 45) {
                        coins.splice(i, 1);
                        score += 500;
                        // Coin pickup particles
                        for(let j=0; j<8; j++) {
                            particles.push({
                                x: cX, y: c.y,
                                vx: (Math.random() - 0.5) * 6,
                                vy: (Math.random() - 0.5) * 6,
                                life: 1.0, size: 2 + Math.random() * 3,
                                type: 'sparkle'
                            });
                        }
                    }
                }

                score++;
                scoreEl.innerText = 'Score: ' + Math.floor(score / 10);
            }

            function drawTrain(ctx, x, y, w, h, isPlayer, jumpOffset, colorId) {
                const actualY = y - (jumpOffset || 0);

                // Shadow
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(x + 15, y + 15, w, h);

                // Main body
                const grad = ctx.createLinearGradient(x, actualY, x + w, actualY);
                if (isPlayer) {
                    grad.addColorStop(0, '#1a2a6c');
                    grad.addColorStop(0.5, '#11998e');
                    grad.addColorStop(1, '#1a2a6c');
                } else {
                    const colors = [
                        ['#8E0E00', '#1F1C18'], // Dark Red
                        ['#e65c00', '#F9D423'], // Orange
                        ['#232526', '#414345']  // Dark Gray
                    ];
                    const c = colors[colorId % colors.length];
                    grad.addColorStop(0, c[0]);
                    grad.addColorStop(0.5, c[1]);
                    grad.addColorStop(1, c[0]);
                }
                
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.roundRect ? ctx.roundRect(x, actualY, w, h, 8) : ctx.rect(x, actualY, w, h);
                ctx.fill();

                // Roof/Top details
                ctx.fillStyle = 'rgba(0,0,0,0.4)';
                ctx.fillRect(x + 8, actualY + 8, w - 16, h - 16);
                
                ctx.fillStyle = '#7f8c8d';
                for(let i=20; i<h-30; i+=15) {
                    ctx.fillRect(x + 12, actualY + i, w - 24, 6);
                }

                // Cabin
                ctx.fillStyle = '#2c3e50';
                if (isPlayer) {
                    ctx.fillRect(x + 4, actualY + 4, w - 8, 25);
                    ctx.fillStyle = '#f1c40f'; // Headlights
                    ctx.fillRect(x + 8, actualY + 4, 12, 8);
                    ctx.fillRect(x + w - 20, actualY + 4, 12, 8);
                } else {
                    ctx.fillRect(x + 4, actualY + h - 29, w - 8, 25);
                    ctx.fillStyle = '#f1c40f';
                    ctx.fillRect(x + 8, actualY + h - 12, 12, 8);
                    ctx.fillRect(x + w - 20, actualY + h - 12, 12, 8);
                }
            }

            function drawBarrier(ctx, x, y, w, h) {
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(x + 5, y + 5, w, h);

                ctx.fillStyle = '#555';
                ctx.fillRect(x + 8, y, 12, h);
                ctx.fillRect(x + w - 20, y, 12, h);

                ctx.fillStyle = '#e67e22';
                ctx.fillRect(x, y + 10, w, 16);
                ctx.fillStyle = '#d35400';
                ctx.fillRect(x, y + 26, w, 16);

                ctx.fillStyle = '#f1c40f';
                for(let i=0; i<w; i+=25) {
                    ctx.beginPath();
                    ctx.moveTo(x + i, y + 10);
                    ctx.lineTo(x + i + 12, y + 10);
                    ctx.lineTo(x + i, y + 42);
                    ctx.lineTo(x + i - 12, y + 42);
                    ctx.fill();
                }
            }

            function drawCoin(ctx, x, y, frame) {
                const scaleX = Math.abs(Math.sin(frame * 0.08));
                ctx.save();
                ctx.translate(x, y);
                
                ctx.shadowColor = '#f39c12';
                ctx.shadowBlur = 10;
                
                ctx.scale(scaleX, 1);
                ctx.beginPath();
                ctx.arc(0, 0, 14, 0, Math.PI * 2);
                ctx.fillStyle = '#f1c40f';
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#e67e22';
                ctx.stroke();

                ctx.fillStyle = '#d35400';
                ctx.font = 'bold 16px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('$', 0, 0);

                ctx.restore();
            }

            function drawHeadlightBeams(ctx, x, y, w, h, isPlayer, actualY) {
                if (isPlayer) {
                    const grad = ctx.createLinearGradient(x, actualY, x, actualY - 200);
                    grad.addColorStop(0, 'rgba(255, 255, 150, 0.5)');
                    grad.addColorStop(1, 'rgba(255, 255, 150, 0)');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.moveTo(x + 14, actualY + 4);
                    ctx.lineTo(x + w - 14, actualY + 4);
                    ctx.lineTo(x + w + 60, actualY - 200);
                    ctx.lineTo(x - 60, actualY - 200);
                    ctx.fill();
                } else {
                    const grad = ctx.createLinearGradient(x, actualY + h, x, actualY + h + 200);
                    grad.addColorStop(0, 'rgba(255, 255, 150, 0.5)');
                    grad.addColorStop(1, 'rgba(255, 255, 150, 0)');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.moveTo(x + 14, actualY + h - 4);
                    ctx.lineTo(x + w - 14, actualY + h - 4);
                    ctx.lineTo(x + w + 60, actualY + h + 200);
                    ctx.lineTo(x - 60, actualY + h + 200);
                    ctx.fill();
                }
            }

            function draw() {
                // Background & Environment
                const grassScrollY = (trackOffset * 1.5) % height;
                ctx.drawImage(grassTex, 0, grassScrollY - height);
                ctx.drawImage(grassTex, 0, grassScrollY);

                ctx.save();
                ctx.beginPath();
                ctx.rect(trackStartX, 0, trackWidth, height);
                ctx.clip();
                
                const scrollY = trackOffset % height;
                ctx.drawImage(gravelTex, 0, scrollY - height);
                ctx.drawImage(gravelTex, 0, scrollY);

                // Ties
                for (let ty = (trackOffset % 60) - 60; ty < height; ty += 60) {
                    ctx.fillStyle = 'rgba(0,0,0,0.7)';
                    ctx.fillRect(trackStartX + 10, ty + 6, trackWidth - 20, 16);
                    ctx.fillStyle = '#3e2723';
                    ctx.fillRect(trackStartX + 10, ty, trackWidth - 20, 16);
                    ctx.fillStyle = '#2b1a17';
                    ctx.fillRect(trackStartX + 15, ty + 4, trackWidth - 30, 2);
                    ctx.fillRect(trackStartX + 20, ty + 10, trackWidth - 40, 2);
                }

                // Rails
                for (let i = 0; i < laneCount; i++) {
                    const lx = getLaneCenter(i) - laneWidth * 0.4;
                    const rx = getLaneCenter(i) + laneWidth * 0.4;
                    
                    const drawRail = (x) => {
                        ctx.fillStyle = 'rgba(0,0,0,0.6)';
                        ctx.fillRect(x - 3, 0, 10, height);
                        ctx.fillStyle = '#7f8c8d';
                        ctx.fillRect(x - 5, 0, 10, height);
                        ctx.fillStyle = '#bdc3c7';
                        ctx.fillRect(x - 3, 0, 6, height);
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(x - 1, 0, 2, height);
                    };
                    drawRail(lx);
                    drawRail(rx);
                }
                ctx.restore();

                // Scenery Trees
                scenery.forEach(s => {
                    const sx = s.side === 0 ? trackStartX / 2 : width - trackStartX / 2;
                    ctx.fillStyle = 'rgba(0,0,0,0.5)';
                    ctx.beginPath(); ctx.arc(sx + 15, s.y + 15, s.size * 0.8, 0, Math.PI * 2); ctx.fill();
                    
                    ctx.fillStyle = '#1e824c';
                    ctx.beginPath(); ctx.arc(sx, s.y, s.size, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#2ecc71';
                    ctx.beginPath(); ctx.arc(sx - s.size*0.2, s.y - s.size*0.2, s.size * 0.5, 0, Math.PI * 2); ctx.fill();
                });

                // Particles (under objects)
                particles.forEach(p => {
                    if (p.type === 'dust' || p.type === 'smoke') {
                        ctx.fillStyle = `rgba(150, 150, 150, ${p.life * 0.5})`;
                        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
                    }
                });

                // Obstacles
                obstacles.forEach(o => {
                    const ox = getLaneCenter(o.lane) - o.width / 2;
                    if (o.type === 'train') {
                        drawTrain(ctx, ox, o.y, o.width, o.height, false, 0, o.colorId);
                    } else {
                        drawBarrier(ctx, ox, o.y, o.width, o.height);
                    }
                });

                // Coins
                coins.forEach(c => drawCoin(ctx, getLaneCenter(c.lane), c.y, frameCount));

                // Player
                const px = player.visualX - player.width / 2;
                const py = height - player.height - 20;
                drawTrain(ctx, px, py, player.width, player.height, true, player.y);

                // Headlight Beams (Player & Trains)
                ctx.globalCompositeOperation = 'screen';
                obstacles.forEach(o => {
                    if (o.type === 'train') {
                        drawHeadlightBeams(ctx, getLaneCenter(o.lane) - o.width / 2, o.y, o.width, o.height, false, o.y);
                    }
                });
                drawHeadlightBeams(ctx, px, py, player.width, player.height, true, py - player.y);
                ctx.globalCompositeOperation = 'source-over';

                // Particles (Sparkles over objects)
                particles.forEach(p => {
                    if (p.type === 'sparkle') {
                        ctx.fillStyle = `rgba(241, 196, 15, ${p.life})`;
                        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
                    }
                });

                // Lighting Overlay / Vignette
                const vig = ctx.createRadialGradient(width/2, height/2, height*0.3, width/2, height/2, height*0.9);
                vig.addColorStop(0, 'rgba(0,0,0,0)');
                vig.addColorStop(1, 'rgba(0,0,0,0.5)');
                ctx.fillStyle = vig;
                ctx.fillRect(0, 0, width, height);

                // UI
                if (gameState === 'START') {
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                    ctx.fillRect(0, 0, width, height);
                    ctx.fillStyle = '#f39c12';
                    ctx.font = 'bold 36px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('TRAIN RUNNER', width / 2, height / 2 - 40);
                    ctx.fillStyle = '#fff';
                    ctx.font = '20px Arial';
                    ctx.fillText('Press SPACE to Start', width / 2, height / 2 + 20);
                } else if (gameState === 'GAMEOVER') {
                    ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                    ctx.fillRect(0, 0, width, height);
                    ctx.fillStyle = '#e74c3c';
                    ctx.font = 'bold 44px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('CRASHED', width / 2, height / 2 - 50);
                    ctx.fillStyle = '#fff';
                    ctx.font = '24px Arial';
                    ctx.fillText('Score: ' + Math.floor(score / 10), width / 2, height / 2);
                    ctx.fillText('High Score: ' + Math.floor(highScore / 10), width / 2, height / 2 + 40);
                    ctx.fillStyle = '#f39c12';
                    ctx.font = 'bold 20px Arial';
                    ctx.fillText('Press R to Restart', width / 2, height / 2 + 100);
                }
            }

            // Input handling
            window.addEventListener('keydown', e => {
                if (gameState === 'START' && e.code === 'Space') {
                    resetGame();
                } else if (gameState === 'GAMEOVER' && (e.key === 'r' || e.key === 'R')) {
                    resetGame();
                } else if (gameState === 'PLAYING') {
                    if (e.key === 'ArrowLeft' && player.lane > 0) player.lane--;
                    else if (e.key === 'ArrowRight' && player.lane < laneCount - 1) player.lane++;
                    else if ((e.key === 'ArrowUp' || e.code === 'Space') && player.y === 0) player.vy = jumpForce;
                }
            });

            let touchStartX = 0;
            window.addEventListener('touchstart', e => {
                touchStartX = e.touches[0].clientX;
                if (gameState !== 'PLAYING') resetGame();
            });
            window.addEventListener('touchend', e => {
                if (gameState !== 'PLAYING') return;
                const touchEndX = e.changedTouches[0].clientX;
                const diff = touchEndX - touchStartX;
                if (Math.abs(diff) > 30) {
                    if (diff > 0 && player.lane < laneCount - 1) player.lane++;
                    else if (diff < 0 && player.lane > 0) player.lane--;
                } else {
                    if (player.y === 0) player.vy = jumpForce;
                }
            });

            function gameLoop() {
                update();
                draw();
                requestAnimationFrame(gameLoop);
            }

            gameLoop();
        })();
    </script>
</body>
</html>
